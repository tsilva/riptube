name: Release
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Compile package
        run: uv run python -m compileall riptube
      - name: Smoke test import
        run: uv run python -c "import riptube; from riptube import download_video; assert riptube.__version__; assert callable(download_video)"
      - name: Smoke test CLI
        run: uv run python -m riptube.cli --help

  build:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ github.event_name == 'workflow_dispatch' || steps.check-version.outputs.tag_exists == 'false' }}
      release: ${{ steps.check-version.outputs.tag_exists == 'false' }}
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check version
        id: check-version
        run: |
          VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${TAG_EXISTS}" >> "$GITHUB_OUTPUT"
      - name: Setup uv
        if: github.event_name == 'workflow_dispatch' || steps.check-version.outputs.tag_exists == 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache: true
      - name: Build package
        if: github.event_name == 'workflow_dispatch' || steps.check-version.outputs.tag_exists == 'false'
        run: uv build
      - name: Store package artifacts
        if: github.event_name == 'workflow_dispatch' || steps.check-version.outputs.tag_exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Create GitHub release
        run: gh release create "$TAG" --title "$TAG" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}

  publish:
    needs: [build]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
